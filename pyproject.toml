[project]
name = "blackbelt"
version = "0.1.0"
description = "El cinturon de herramientas CLI local-first"
authors = [{ name = "Pedro Mencias Garcia" }]
dependencies = [
    "typer>=0.12",
    "rich>=13.0",
    "pyyaml>=6.0",
    "python-dotenv>=1.0",
    "keyring>=25.0",
    "ollama>=0.4",
    "requests>=2.31",
    "psutil>=5.9",
    "plotext>=5.3",
]

[project.scripts]
blackbelt = "blackbelt.__main__:main"

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"
