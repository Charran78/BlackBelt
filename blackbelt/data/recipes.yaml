- id: list_processes
  titulo: Ver procesos en ejecución
  categoria: sistema
  os: [linux, macos, windows]
  keywords: [procesos, cpu, memoria, consumo, top, corriendo]
  preguntas:
    - id: orden
      texto: ¿Ordenar por CPU o memoria?
      tipo: opcion
      opciones: [cpu, memoria]
      default: cpu
      valores:
        linux:
          cpu: "%cpu"
          memoria: "%mem"
        macos:
          cpu: "4"
          memoria: "5"
        windows:
          cpu: CPU
          memoria: WorkingSet
  comandos:
    linux:
      cmd: ps aux --sort=-{orden} | head -20
      descripcion: Muestra los 20 procesos con mayor consumo de {orden}.
      riesgo: SAFE
    macos:
      cmd: ps -Ao pid,ppid,user,%cpu,%mem,command | sort -rn -k{orden} | head -20
      descripcion: Muestra los 20 procesos con mayor consumo de {orden}.
      riesgo: SAFE
    windows:
      cmd: >-
        Get-Process | Sort-Object {orden} -Descending |
        Select-Object -First 20 Name, CPU,
        @{N='MemoriaMB';E={[math]::Round($_.WorkingSet/1MB,2)}}
      descripcion: Muestra los 20 procesos con mayor consumo de {orden}.
      riesgo: SAFE

- id: grep_recursive
  titulo: Buscar texto dentro de archivos
  categoria: archivos
  os: [linux, macos, windows]
  keywords: [grep, buscar, texto, contenido, dentro, archivos, notas]
  preguntas:
    - id: patron
      texto: ¿Qué texto buscar?
      tipo: texto
      default: ""
    - id: dir
      texto: ¿En qué carpeta buscar?
      tipo: path
      default: .
  comandos:
    linux:
      cmd: >-
        grep -rn --include='*.txt' --include='*.md' --include='*.py'
        -- {patron} {dir} 2>/dev/null | head -50
      descripcion: Busca el texto indicado en archivos txt, md y py dentro de {dir}.
      riesgo: SAFE
    macos:
      cmd: >-
        grep -rn --include='*.txt' --include='*.md' --include='*.py'
        -- {patron} {dir} 2>/dev/null | head -50
      descripcion: Busca el texto indicado en archivos txt, md y py dentro de {dir}.
      riesgo: SAFE
    windows:
      cmd: >-
        Get-ChildItem -Path {dir} -Recurse -File
        -Include *.txt,*.md,*.py -ErrorAction SilentlyContinue |
        Select-String -SimpleMatch -Pattern {patron} |
        Select-Object -First 50
      descripcion: Busca el texto indicado en archivos txt, md y py dentro de {dir}.
      riesgo: SAFE

- id: clean_temp
  titulo: Revisar o limpiar archivos temporales antiguos
  categoria: mantenimiento
  os: [linux, macos, windows]
  keywords: [limpiar, temporales, basura, borrar, tmp, cache]
  preguntas:
    - id: modo
      texto: ¿Quieres previsualizar o borrar los archivos de más de 7 días?
      tipo: opcion
      opciones: [preview, borrar]
      default: preview
  comandos:
    linux:
      cmd_preview: find /tmp -type f -atime +7 2>/dev/null | head -50
      cmd_borrar: >-
        find /tmp -type f -atime +7 -exec rm -- {} +
      descripcion: Revisa o elimina archivos de /tmp sin acceso en más de 7 días.
      riesgo_preview: SAFE
      riesgo_borrar: CRITICAL
    macos:
      cmd_preview: find /tmp -type f -atime +7 2>/dev/null | head -50
      cmd_borrar: >-
        find /tmp -type f -atime +7 -exec rm -- {} +
      descripcion: Revisa o elimina archivos de /tmp sin acceso en más de 7 días.
      riesgo_preview: SAFE
      riesgo_borrar: CRITICAL
    windows:
      cmd_preview: >-
        Get-ChildItem $env:TEMP -Recurse -File -ErrorAction SilentlyContinue |
        Where-Object { $_.LastAccessTime -lt (Get-Date).AddDays(-7) } |
        Select-Object -First 50 FullName
      cmd_borrar: >-
        Get-ChildItem $env:TEMP -Recurse -File -ErrorAction SilentlyContinue |
        Where-Object { $_.LastAccessTime -lt (Get-Date).AddDays(-7) } |
        Remove-Item
      descripcion: Revisa o elimina archivos temporales sin acceso en más de 7 días.
      riesgo_preview: SAFE
      riesgo_borrar: CRITICAL

