- id: disk_usage
  titulo: Ver uso de disco
  categoria: sistema
  os: [linux, macos, windows]
  keywords: [disco, espacio, libre, ocupado, df, capacidad, unidades]
  preguntas: []
  comandos:
    linux:
      cmd: df -h
      descripcion: Muestra el espacio usado y libre en los discos.
      riesgo: SAFE
    macos:
      cmd: df -h
      descripcion: Muestra el espacio usado y libre en los discos.
      riesgo: SAFE
