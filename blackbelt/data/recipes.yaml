- id: find_large_files
  titulo: Encontrar archivos grandes
  categoria: archivos
  os: [linux, macos, windows]
  keywords: [grandes, espacio, ocupan, tamaño, pesados, disco, archivos]
  preguntas:
    - id: dir
      texto: ¿En qué carpeta buscar?
      tipo: path
      default: .
    - id: tam
      texto: ¿A partir de qué tamaño?
      tipo: opcion
      opciones: ["+100M", "+500M", "+1G", "+5G"]
      default: "+100M"
      valores:
        windows:
          "+100M": "104857600"
          "+500M": "524288000"
          "+1G": "1073741824"
          "+5G": "5368709120"
  comandos:
    linux:
      cmd: >-
        find {dir} -type f -size {tam} -exec ls -lh {} +
        2>/dev/null | sort -k5 -h
      descripcion: Lista archivos mayores de {tam} en {dir}, ordenados por tamaño.
      riesgo: SAFE
    macos:
      cmd: >-
        find {dir} -type f -size {tam} -exec ls -lh {} +
        2>/dev/null | sort -k5 -h
      descripcion: Lista archivos mayores de {tam} en {dir}, ordenados por tamaño.
      riesgo: SAFE
    windows:
      cmd: >-
        Get-ChildItem -LiteralPath {dir} -Recurse -File
        -ErrorAction SilentlyContinue |
        Where-Object { $_.Length -gt {tam} } |
        Sort-Object Length -Descending |
        Select-Object -First 30 FullName, Length
      descripcion: Lista los 30 archivos mayores de {tam} en {dir}.
      riesgo: SAFE

