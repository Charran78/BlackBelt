      texto: ¿Cuántos días hacia atrás?
      tipo: opcion
      opciones: ["1", "7", "30"]
      default: "7"
  comandos:
    linux:
      cmd: find {dir} -type f -mtime -{dias} -print 2>/dev/null | head -100
