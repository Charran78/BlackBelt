        -ErrorAction SilentlyContinue |
        Where-Object { $_.LastWriteTime -gt (Get-Date).AddDays(-{dias}) } |
        Sort-Object LastWriteTime -Descending |
        Select-Object -First 100 FullName, LastWriteTime
      descripcion: Muestra hasta 100 archivos modificados en los últimos {dias} días.
